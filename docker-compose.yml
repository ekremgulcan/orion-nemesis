# Lokal gelistirme icin MS SQL Server container'i.
# Kullanim: docker compose up -d
# Baglanti: localhost:1433, sa / Orion_2026_Str0ng!
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Apple Silicon (Colima/Rosetta): MSSQL 2022 image is amd64-only
    platform: linux/amd64
    container_name: orion-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Orion_2026_Str0ng!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - orion-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  orion-mssql-data:
