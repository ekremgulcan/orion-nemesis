server:
  port: 8080

spring:
  application:
    name: orion-v3-nemesis
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=orion;encrypt=true;trustServerCertificate=true
    username: sa
    password: Orion_2026_Str0ng!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      # Sema tamamen Flyway tarafindan yonetiliyor (db/migration altindaki V1...V8).
      # Hibernate'in kendi validate/update mekanizmasi NVARCHAR/VARCHAR gibi
      # ayrintilarda gereksiz uyusmazlik cikardigi icin devre disi birakildi.
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServer2012Dialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  web:
    resources:
      # Dev'de src/main/webapp altindaki statik dosyalar (css/js) her
      # istekte diskten TAZE okunsun diye cache tamamen kapatildi -
      # aksi halde Spring'in resource-chain cache'i ILK basarili
      # okumayi surekli hafizada tutuyor, dosya degissede sonraki
      # istekler eski icerigi donduruyor (yeniden baslatmadan
      # yakalanmasi zor bir gotcha - .zul dosyalari ZK'nin kendi
      # servlet'inden gectigi icin bu sorunu yasamiyor, sadece bu
      # klasordeki css/js gibi statik dosyalar etkileniyor).
      chain:
        cache: false
      cache:
        period: 0

logging:
  level:
    com.orion: DEBUG
